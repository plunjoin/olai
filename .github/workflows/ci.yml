name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache webfront dependencies
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/wf_modules
          key: webfront-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'go.sum') }}
          restore-keys: |
            webfront-${{ runner.os }}-

      - name: Install frontend dependencies
        run: go tool wf install ./web

      - name: Build portal
        run: go tool wf build -modules ../wf_modules ./web/portal

      - name: Build admin
        run: go tool wf build -mode spa -base /admin -modules ../wf_modules ./web/admin

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  docker:
    name: Validate image
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build timestamp
        id: meta
        shell: bash
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: olai:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --name olai-ci -p 4321:4321 \
            -e HOST=0.0.0.0 \
            -e PORT=4321 \
            olai:ci
          trap 'docker logs --tail 100 olai-ci || true; docker rm -f olai-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/api/status >/dev/null; then
              echo "API responded after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become ready in 60 seconds." >&2
          exit 1
