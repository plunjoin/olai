# 1Panel 编排专用版本。
# 不要填写 env_file；把下方 environment 引用的变量写入 1Panel 的“环境变量”输入框。
name: olai

services:
  olai:
    image: ${OLAI_IMAGE:-ghcr.io/plunjoin/olai:latest}
    container_name: olai
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: '4321'
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SITE_ORIGIN: ${SITE_ORIGIN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - '${OLAI_BIND:-0.0.0.0}:${OLAI_PORT:-4321}:4321'
    volumes:
      - olai-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  olai-data:
    name: olai-data
